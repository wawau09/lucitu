name: iOS Test Build

on:
  push:
    branches: [ main ] 

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # ➔ 16.0 대신 현재 러너가 제공하는 가장 최신의 안정판 Xcode(16.1~16.2+)를 잡습니다.
      - name: Set up Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      # ➔ pub get 대신 pub upgrade를 실행하여 빌드 에러가 해결된 최신 패키지 버전을 가져옵니다.
      - name: Clear Cache & Upgrade dependencies
        run: |
          flutter clean
          flutter pub upgrade
          rm -f ios/Podfile.lock

      - name: Build iOS (No Sign)
        run: flutter build ios --no-codesign --release

      - name: Build IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: Runner.ipa