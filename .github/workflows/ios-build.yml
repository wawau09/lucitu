name: iOS Test Build

on:
  push:
    branches: [ main ] 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4 # v3에서 v4로 업데이트

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (No Sign)
        run: flutter build ios --config-only

      - name: Build IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4 # ❌ v3에서 ⭕ v4로 업데이트
        with:
          name: ios-app
          path: Runner.ipa