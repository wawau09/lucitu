name: iOS Test Build

on:
  push:
    branches: [ main ] 

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ➔ [추가] flutter_naver_map의 SPM 문법 에러를 우회하기 위해 SPM 기능을 강제로 비활성화합니다.
      - name: Disable Swift Package Manager
        run: flutter config --no-swift-package-manager

      # 만약 로컬 Podfile이 꼬여있을 수 있으므로 안전하게 clean 후 진행합니다.
      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build iOS (No Sign)
        run: flutter build ios --no-codesign --release

      - name: Build IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: Runner.ipa