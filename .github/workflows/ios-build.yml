name: iOS Test Build

on:
  push:
    branches: [ main ] 

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      # ➔ 꼬여있는 Podfile.lock을 삭제하여 최신 NMapsMap(3.23.0) 버전을 강제로 갱신하도록 설정했습니다.
      - name: Clear Cache & Install dependencies
        run: |
          flutter clean
          flutter pub get
          rm -f ios/Podfile.lock

      - name: Build iOS (No Sign)
        run: flutter build ios --no-codesign --release

      - name: Build IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: Runner.ipa