name: iOS Test Build

on:
  push:
    branches: [ main ] 

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 1. 빌드 기본 구성을 먼저 실행하여 플러터가 파일들을 13.0으로 복구(Upgrade)하도록 둡니다.
      - name: Run Flutter Config Only (Triggers internal migration)
        run: flutter build ios --config-only

      # 2. 플러터가 13.0으로 되돌려놓은 파일들을 잽싸게 15.0으로 강제 변환합니다.
      - name: Force iOS 15.0 Deployment Target
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/g" ios/Podfile
          if [ -f ios/Flutter/AppFrameworkInfo.plist ]; then
            sed -i '' 's/<string>13.0<\/string>/<string>15.0<\/string>/g' ios/Flutter/AppFrameworkInfo.plist
          fi

      # 3. 이제 모든 파일이 15.0으로 고정된 상태에서 진짜 컴파일을 시작합니다.
      - name: Build iOS (No Sign)
        run: flutter build ios --no-codesign --release

      - name: Build IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: Runner.ipa