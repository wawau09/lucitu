<html>

<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Mobile & PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlaceList">
  <meta name="application-name" content="PlaceList">
  <meta name="theme-color" content="#6C63FF">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>placelist</title>
  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=yai391e7li"></script>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      background-color: #121212;
    }
  </style>
</head>

<body>
  <script>
    function createMarkerHtml(name, rating, isSelected, clusterIndex, clusterTotal) {
      var bg = isSelected ? '#6C63FF' : '#ffffff';
      var textColor = isSelected ? '#ffffff' : '#1C1C1E';
      var iconColor = isSelected ? '#ffffff' : '#6C63FF';
      var borderColor = isSelected ? '#8A84FF' : '#6C63FF';
      var shadow = isSelected ? '0 4px 14px rgba(108,99,255,0.45)' : '0 3px 8px rgba(0,0,0,0.18)';
      var ratingBadge = '';
      if (rating && rating > 0) {
        var numStr = Number(rating).toFixed(1);
        var rBg = isSelected ? 'rgba(255,255,255,0.25)' : 'rgba(108,99,255,0.12)';
        var rColor = isSelected ? '#ffffff' : '#6C63FF';
        var sColor = isSelected ? '#FFE082' : '#FFA000';
        ratingBadge = '<div style="background:' + rBg + '; color:' + rColor + '; border-radius:6px; padding:1px 4px; font-size:9px; font-weight:700; display:flex; align-items:center; gap:2px; margin-left:4px;"><span style="color:' + sColor + ';">★</span>' + numStr + '</div>';
      }
      var clusterBadge = '';
      if (clusterTotal && clusterTotal > 1) {
        var cBg = isSelected ? 'rgba(255,255,255,0.3)' : 'rgba(255,152,0,0.18)';
        var cColor = isSelected ? '#ffffff' : '#E65100';
        clusterBadge = '<div style="background:' + cBg + '; color:' + cColor + '; border-radius:6px; padding:1px 4px; font-size:9px; font-weight:700; margin-left:4px;">' + (clusterIndex + 1) + '/' + clusterTotal + '</div>';
      }
      return '<div style="display:inline-flex; flex-direction:column; align-items:center; cursor:pointer; transform:translate(-50%, -100%); filter:drop-shadow(0 2px 4px rgba(0,0,0,0.15));">' +
        '<div style="background:' + bg + '; color:' + textColor + '; border:1.5px solid ' + borderColor + '; border-radius:12px; padding:5px 9px; font-family:Pretendard, -apple-system, sans-serif; font-size:11px; font-weight:600; box-shadow:' + shadow + '; display:flex; align-items:center; white-space:nowrap; gap:4px;">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="' + iconColor + '"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>' +
          '<span>' + (name || '') + '</span>' +
          ratingBadge +
          clusterBadge +
        '</div>' +
        '<div style="width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:7px solid ' + borderColor + '; margin-top:-1px;"></div>' +
      '</div>';
    }

    var webMarkersMap = {};
    var currentWebMap = null;

    window.selectWebMarker = function(storeId) {
      var targetLoc = null;
      Object.keys(webMarkersMap).forEach(function(id) {
        var item = webMarkersMap[id];
        if (item && item.marker) {
          var isSel = (storeId && id === String(storeId));
          item.marker.setIcon({
            content: createMarkerHtml(item.name, item.rating, isSel, item.clusterIndex, item.clusterTotal),
            anchor: new naver.maps.Point(0, 0)
          });
          item.marker.setZIndex(isSel ? 1000 : (item.clusterIndex ? 1 + item.clusterIndex : 1));
          if (isSel) {
            targetLoc = item.loc;
          }
        }
      });
      if (targetLoc && currentWebMap) {
        currentWebMap.panTo(targetLoc);
      }
    };

    function initNaverMap(element, lat, lng, name) {
      var mapOptions = {
        center: new naver.maps.LatLng(lat, lng),
        zoom: 15,
        draggable: true,
        pinchZoom: true,
        scrollWheel: true,
        keyboardShortcuts: false,
        disableDoubleTapZoom: false,
        disableDoubleClickZoom: false,
        disableTwoFingerTapZoom: false,
        mapDataControl: false,
        scaleControl: false,
      };
      var map = new naver.maps.Map(element, mapOptions);

      element.style.touchAction = 'none';

      var stopScrollEvent = function(e) {
        e.stopPropagation();
      };
      element.addEventListener('wheel', stopScrollEvent, { passive: true });

      var marker = new naver.maps.Marker({
        position: new naver.maps.LatLng(lat, lng),
        map: map,
        icon: {
          content: createMarkerHtml(name || '', 0, true, 0, 1),
          anchor: new naver.maps.Point(0, 0)
        }
      });
    }

    function initNaverMapMulti(element, stores, selectedId) {
      if (!stores || stores.length === 0) return;
      webMarkersMap = {};
      var first = stores[0];
      var mapOptions = {
        center: new naver.maps.LatLng(first.lat, first.lng),
        zoom: 13,
        draggable: true,
        pinchZoom: true,
        scrollWheel: true,
        keyboardShortcuts: false,
        disableDoubleTapZoom: false,
        disableDoubleClickZoom: false,
        disableTwoFingerTapZoom: false,
        mapDataControl: false,
        scaleControl: false,
      };
      var map = new naver.maps.Map(element, mapOptions);
      currentWebMap = map;

      element.style.touchAction = 'none';

      var stopScrollEvent = function(e) {
        e.stopPropagation();
      };
      element.addEventListener('wheel', stopScrollEvent, { passive: true });

      var bounds = new naver.maps.LatLngBounds();
      stores.forEach(function(s) {
        if (s.lat && s.lng) {
          var loc = new naver.maps.LatLng(s.lat, s.lng);
          bounds.extend(loc);
          var isSel = (selectedId && String(s.id) === String(selectedId));
          var marker = new naver.maps.Marker({
            position: loc,
            map: map,
            title: s.name || '',
            zIndex: isSel ? 1000 : (s.clusterIndex ? 1 + s.clusterIndex : 1),
            icon: {
              content: createMarkerHtml(s.name || '', s.rating, isSel, s.clusterIndex, s.clusterTotal),
              anchor: new naver.maps.Point(0, 0)
            }
          });

          webMarkersMap[String(s.id)] = {
            marker: marker,
            name: s.name || '',
            rating: s.rating,
            clusterIndex: s.clusterIndex,
            clusterTotal: s.clusterTotal,
            loc: loc
          };

          naver.maps.Event.addListener(marker, 'click', function() {
            window.selectWebMarker(String(s.id));
            if (window.flutterOnSelectStore) {
              window.flutterOnSelectStore(String(s.id));
            }
          });
        }
      });
      if (stores.length > 1) {
        map.fitBounds(bounds, { top: 40, right: 40, bottom: 40, left: 40 });
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
