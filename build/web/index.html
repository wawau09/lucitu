<html>

<head>

    This is a placeholder for base href that will be replaced by the value of

  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>placelist</title>
  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=yai391e7li"></script>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      position: fixed;
      overflow: hidden;
      /* 브라우저 기본 스와이프 탐색 및 바운스 효과 방지 */
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      /* 터치 제스처를 브라우저가 아닌 플러터(웹)에서 완전 제어하도록 설정 */
      touch-action: none;
      -webkit-text-size-adjust: 100%;
    }
  </style>
</head>

<body>
  <script>
    function createMarkerHtml(name, rating, isSelected) {
      var bg = isSelected ? '#6C63FF' : '#ffffff';
      var textColor = isSelected ? '#ffffff' : '#1C1C1E';
      var iconColor = isSelected ? '#ffffff' : '#6C63FF';
      var borderColor = isSelected ? '#8A84FF' : '#6C63FF';
      var shadow = isSelected ? '0 4px 14px rgba(108,99,255,0.45)' : '0 3px 8px rgba(0,0,0,0.18)';
      var ratingBadge = '';
      if (rating && rating > 0) {
        var numStr = Number(rating).toFixed(1);
        var rBg = isSelected ? 'rgba(255,255,255,0.25)' : 'rgba(108,99,255,0.12)';
        var rColor = isSelected ? '#ffffff' : '#6C63FF';
        var sColor = isSelected ? '#FFE082' : '#FFA000';
        ratingBadge = '<div style="background:' + rBg + '; color:' + rColor + '; border-radius:6px; padding:1px 4px; font-size:9px; font-weight:700; display:flex; align-items:center; gap:2px; margin-left:4px;"><span style="color:' + sColor + ';">★</span>' + numStr + '</div>';
      }
      return '<div style="display:inline-flex; flex-direction:column; align-items:center; cursor:pointer; transform:translate(-50%, -100%); filter:drop-shadow(0 2px 4px rgba(0,0,0,0.15));">' +
        '<div style="background:' + bg + '; color:' + textColor + '; border:1.5px solid ' + borderColor + '; border-radius:12px; padding:5px 9px; font-family:Pretendard, -apple-system, sans-serif; font-size:11px; font-weight:600; box-shadow:' + shadow + '; display:flex; align-items:center; white-space:nowrap; gap:4px;">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="' + iconColor + '"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>' +
          '<span>' + (name || '') + '</span>' +
          ratingBadge +
        '</div>' +
        '<div style="width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:7px solid ' + borderColor + '; margin-top:-1px;"></div>' +
      '</div>';
    }

    function initNaverMap(element, lat, lng, name) {
      var mapOptions = {
        center: new naver.maps.LatLng(lat, lng),
        zoom: 15,
        mapDataControl: false,
        scaleControl: false,
      };
      var map = new naver.maps.Map(element, mapOptions);

      // Prevent event propagation on scroll/touch to stop parent page scroll in Flutter Web
      var stopScrollEvent = function(e) {
        e.stopPropagation();
      };
      element.addEventListener('wheel', stopScrollEvent, { passive: true });
      element.addEventListener('touchstart', stopScrollEvent, { passive: true });
      element.addEventListener('touchmove', stopScrollEvent, { passive: true });
      element.addEventListener('touchend', stopScrollEvent, { passive: true });

      var marker = new naver.maps.Marker({
        position: new naver.maps.LatLng(lat, lng),
        map: map,
        icon: {
          content: createMarkerHtml(name || '', 0, true),
          anchor: new naver.maps.Point(0, 0)
        }
      });
    }

    function initNaverMapMulti(element, stores) {
      if (!stores || stores.length === 0) return;
      var first = stores[0];
      var mapOptions = {
        center: new naver.maps.LatLng(first.lat, first.lng),
        zoom: 13,
        mapDataControl: false,
        scaleControl: false,
      };
      var map = new naver.maps.Map(element, mapOptions);

      var stopScrollEvent = function(e) {
        e.stopPropagation();
      };
      element.addEventListener('wheel', stopScrollEvent, { passive: true });
      element.addEventListener('touchstart', stopScrollEvent, { passive: true });
      element.addEventListener('touchmove', stopScrollEvent, { passive: true });
      element.addEventListener('touchend', stopScrollEvent, { passive: true });

      var bounds = new naver.maps.LatLngBounds();
      stores.forEach(function(s) {
        if (s.lat && s.lng) {
          var loc = new naver.maps.LatLng(s.lat, s.lng);
          bounds.extend(loc);
          var marker = new naver.maps.Marker({
            position: loc,
            map: map,
            title: s.name || '',
            icon: {
              content: createMarkerHtml(s.name || '', s.rating, false),
              anchor: new naver.maps.Point(0, 0)
            }
          });
          naver.maps.Event.addListener(marker, 'click', function() {
            map.panTo(loc);
          });
        }
      });
      if (stores.length > 1) {
        map.fitBounds(bounds, { top: 40, right: 40, bottom: 40, left: 40 });
      }
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
